name: Download Planet GIFs

on:
  workflow_dispatch:

jobs:
  download_gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run GIF downloader
        run: python .github/scripts/download_gifs.py
