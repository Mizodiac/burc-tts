name: MP3 Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Kütüphane yükle
        run: pip install openai

      - name: Script çalıştır
        run: python generate_mp3.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: burclar-mp3
          path: "*.mp3"
