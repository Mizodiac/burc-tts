name: Run Mizodiac Show

on:
  workflow_dispatch:

jobs:
  generate_mp3:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repoyu çek
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Python kur
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pathlib

      # 4️⃣ Eksik MP3 üret (OPENAI API Key env ile)
      - name: Generate missing MP3s
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_missing_mp3.py

      # 5️⃣ MP3’leri commit et (varsa)
      - name: Commit MP3 files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add mp3/
          git commit -m "Add generated mp3 files" || echo "No changes to commit"
          git push
