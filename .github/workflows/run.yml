name: Generate and Commit Zodiac MP3s

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate_mp3:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repoyu çek
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Python kur
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pathlib

      # 4️⃣ API Key ayarla
      - name: Set OpenAI API Key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "API key is set"

      # 5️⃣ Eksik MP3 üret
      - name: Generate missing MP3 files
        run: python generate_missing_mp3.py

      # 6️⃣ MP3’leri commit et
      - name: Commit MP3 files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add mp3/
          git commit -m "Add generated mp3 files" || echo "No changes"
          git push
