<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QR Üretici</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
font-family:sans-serif;
background:#111;
color:white;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
padding:30px;
}

.item{
background:#222;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<h2>Burç QR Kodları</h2>

<div class="grid" id="grid"></div>

<script>

const base = "https://mizodiac.github.io/burc-tts/?burc=";

const burclar = [
"koc","boga","ikizler","yengec",
"aslan","basak","terazi","akrep",
"yay","oglak","kova","balik"
];

const grid = document.getElementById("grid");

burclar.forEach(burc => {

const div = document.createElement("div");
div.className = "item";

const title = document.createElement("h3");
title.innerText = burc.toUpperCase();

const qrDiv = document.createElement("div");

div.appendChild(title);
div.appendChild(qrDiv);
grid.appendChild(div);

new QRCode(qrDiv, {
text: base + burc,
width: 200,
height: 200
});

});

</script>

</body>
</html>
