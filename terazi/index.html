<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burç Deneyimi</title>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
color:white;
text-align:center;
}

#bg{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
opacity:0.35;
}

#btn{
padding:18px 30px;
font-size:20px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,.6);
}

#video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:none;
}
</style>
</head>

<body>

<img id="bg">
<button id="btn"></button>
<video id="video" controls playsinline></video>

<script>

// klasör adını al
const burc = window.location.pathname.split("/")[2];

// burç isimleri
const isimler = {
koc:"Koç",
boga:"Boğa",
ikizler:"İkizler",
yengec:"Yengeç",
aslan:"Aslan",
basak:"Başak",
terazi:"Terazi",
akrep:"Akrep",
yay:"Yay",
oglak:"Oğlak",
kova:"Kova",
balik:"Balık"
};

// elementler
const btn = document.getElementById("btn");
const video = document.getElementById("video");
const bg = document.getElementById("bg");

// dosyaları otomatik bağla
video.src = burc + ".mp4";
bg.src = burc + ".jpg";

// buton yazısı
btn.innerText = isimler[burc] + " Burcunu İzle";

// tıklayınca video
btn.onclick = ()=>{
video.style.display = "block";
video.play();
};

// bitince kapat
video.onended = ()=>{
video.style.display = "none";
};

</script>

</body>
</html>
