<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burç Deneyimi</title>

<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:sans-serif;
  color:white;
  text-align:center;
  overflow:hidden;
}

#bg{
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  top:0;
  left:0;
}

#overlay{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:rgba(0,0,0,0.35); /* hafif karartma */
  z-index:0;
}

#btn{
  padding:18px 30px;
  font-size:20px;
  background:gold;
  color:black;
  border:none;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.6);
  z-index:1;
  transition:0.3s;
}

#btn:hover{
  transform:scale(1.05);
}

#video{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:black;
  display:none;
  z-index:2;
  object-fit:cover;
}
</style>
</head>

<body>

<img id="bg">
<div id="overlay"></div>
<button id="btn"></button>
<video id="video" controls playsinline></video>

<script>

// klasör adını al
const burc = window.location.pathname.split("/")[2];

// burç isimleri
const isimler = {
koc:"Koç",
boga:"Boğa",
ikizler:"İkizler",
yengec:"Yengeç",
aslan:"Aslan",
basak:"Başak",
terazi:"Terazi",
akrep:"Akrep",
yay:"Yay",
oglak:"Oğlak",
kova:"Kova",
balik:"Balık"
};

// elementler
const btn = document.getElementById("btn");
const video = document.getElementById("video");
const bg = document.getElementById("bg");
const overlay = document.getElementById("overlay");

// dosyaları otomatik bağla
video.src = burc + ".mp4";
bg.src = burc + ".jpg";

// buton yazısı
btn.innerText = isimler[burc] + " Burcunu İzle";

// tıklayınca video aç ve overlay hafif karart
btn.onclick = ()=>{
  video.style.display = "block";
  overlay.style.background = "rgba(0,0,0,0.7)";
  video.play();
};

// bitince kapat ve overlay geri
video.onended = ()=>{
  video.style.display = "none";
  overlay.style.background = "rgba(0,0,0,0.35)";
};

</script>

</body>
</html>
