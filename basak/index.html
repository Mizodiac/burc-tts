<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Başak</title>
<style>
body{margin:0;overflow:hidden;}
.bg{position:fixed;width:100%;height:100%;object-fit:cover;}
button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:linear-gradient(#FFD700,#D4AF37);
font-size:40px;padding:20px 60px;border-radius:20px;border:none;cursor:pointer;box-shadow:0 0 25px gold;}
video{position:fixed;width:100%;height:100%;display:none;background:black;}
</style></head>
<body>
<img src="basak.jpg" class="bg">
<button onclick="play()">BAŞAK</button>
<video id="v" controls></video>
<script>
function play(){v.src="basak.mp4";v.style.display="block";v.play();}
v.onclick=()=>{v.pause();v.style.display="none";}
</script>
</body>
</html>
