<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="zodiac-container">

  <!-- Arka Plan -->
  <img src="zodiac-background.jpg" id="zodiac-bg">

  <!-- Burç -->
  <img id="burc-simge" class="hidden">

  <!-- Element -->
  <img id="element-icon" class="hidden">

  <!-- Özellikler -->
  <div id="ozellikler-display" class="hidden"></div>

  <!-- Sayılar -->
  <div id="sayi-display" class="hidden"></div>

  <!-- Gezegen Video -->
  <video id="gezegen-video" class="hidden" muted></video>

  <!-- Butonlar -->
  <div class="buttons-container">
    <button class="burc-btn" data-burc="koc">Koç</button>
    <button class="burc-btn" data-burc="boga">Boğa</button>
    <button class="burc-btn" data-burc="ikizler">İkizler</button>
    <button class="burc-btn" data-burc="yengec">Yengeç</button>
    <button class="burc-btn" data-burc="aslan">Aslan</button>
    <button class="burc-btn" data-burc="basak">Başak</button>
    <button class="burc-btn" data-burc="terazi">Terazi</button>
    <button class="burc-btn" data-burc="akrep">Akrep</button>
    <button class="burc-btn" data-burc="yay">Yay</button>
    <button class="burc-btn" data-burc="oglak">Oğlak</button>
    <button class="burc-btn" data-burc="kova">Kova</button>
    <button class="burc-btn" data-burc="balik">Balık</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
