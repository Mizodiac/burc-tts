<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burç</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* BLUR ARKA PLAN */
.bg-blur{
    position:fixed;
    width:100%;
    height:100%;
    background:url("zodiac-background.jpg") center/cover no-repeat;
    filter:blur(25px);
    z-index:-1;
}

/* ANA GÖRSEL */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:contain;
}

/* ORTA BUTON */
button{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(#FFD700,#D4AF37);
    color:black;
    font-size:28px;
    font-weight:bold;
    padding:12px 35px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    box-shadow:0 0 20px gold;
    transition:0.3s;
}

button:hover{
    transform:translate(-50%,-50%) scale(1.1);
}

/* VIDEO */
video{
    position:fixed;
    width:100%;
    height:100%;
    display:none;
    background:black;
}

/* TEBRİK MESAJI TAM EKRAN */
#tebrikMessage{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-color:black; /* Ekranı tamamen karartır */
    color:#FFD700;
    font-size:32px;
    text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    opacity:0;
    transition: opacity 1s ease-in-out;
    z-index:20;
}
</style>
</head>

<body>

<div class="bg-blur"></div>
<img src="zodiac-background.jpg" class="bg">

<button id="btn"></button>
<video id="v" controls></video>

<div id="tebrikMessage">
    Tebrikler 🎉<br>
    Bir daha ki siparişinizde <strong>60 TL değerinde Türk Kahvesi</strong> kazandınız!
</div>

<script>
// Burçlar
const burclar = {
    koc: "KOÇ",
    boga: "BOĞA",
    ikizler: "İKİZLER",
    yengec: "YENGEÇ",
    aslan: "ASLAN",
    basak: "BAŞAK",
    terazi: "TERAZİ",
    akrep: "AKREP",
    yay: "YAY",
    oglak: "OĞLAK",
    kova: "KOVA",
    balik: "BALIK"
};

// URL parametreleri
const urlParams = new URLSearchParams(window.location.search);
const burc = urlParams.get("burc");
const id = urlParams.get("id"); // Müşteri ID

// default: koç
const secilen = burc && burclar[burc] ? burc : "koc";

// buton yazısı
const btn = document.getElementById("btn");
btn.innerText = burclar[secilen];

// video ve mesaj elementleri
const v = document.getElementById("v");
const tebrik = document.getElementById("tebrikMessage");

// butona tıklayınca video aç
btn.onclick = function(){
    v.src = secilen + "/" + secilen + ".mp4";
    v.style.display = "block";
    v.play();

    console.log("Müşteri ID:", id);

    // Videoya tıklayınca kapat
    v.onclick = function(){
        this.pause();
        this.style.display = "none";
        tebrik.style.opacity = 0;
        setTimeout(() => { tebrik.style.display = 'none'; }, 1000);
    };

    // Video bittiğinde 10 saniyelik fade-in/fade-out tebrik mesajı
    v.addEventListener("ended", () => {
        // Video kapanıyor
        v.style.display = "none";

        // Mesaj ekranı görünür
        tebrik.style.display = "flex";
        setTimeout(() => { tebrik.style.opacity = 1; }, 50); // fade-in

        // 10 saniye sonra fade-out
        setTimeout(() => {
            tebrik.style.opacity = 0;
            setTimeout(() => { tebrik.style.display = "none"; }, 1000);
        }, 10000);
    });
};
</script>

</body>
</html>
