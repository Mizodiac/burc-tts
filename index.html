<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burç</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* BLUR ARKA PLAN */
.bg-blur{
    position:fixed;
    width:100%;
    height:100%;
    background:url("zodiac-background.jpg") center/cover no-repeat;
    filter:blur(25px);
    z-index:-1;
}

/* ANA GÖRSEL */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:contain;
}

/* BURÇ BUTONLARI */
.burc-btn{
    position:absolute;
    background:linear-gradient(#FFD700,#D4AF37);
    color:black;
    font-size:20px;
    font-weight:bold;
    padding:10px 25px;
    border-radius:15px;
    border:none;
    cursor:pointer;
    box-shadow:0 0 15px gold;
    transition:0.3s;
}
.burc-btn:hover{
    transform:scale(1.1);
}

/* VIDEO */
video{
    position:fixed;
    width:100%;
    height:100%;
    display:none;
    background:black;
}
</style>
</head>

<body>

<div class="bg-blur"></div>
<img src="zodiac-background.jpg" class="bg">

<!-- BURÇ BUTONLARI -->
<button class="burc-btn" data-burc="koc" style="top:45%; left:50%;">KOÇ</button>
<button class="burc-btn" data-burc="boga" style="top:55%; left:60%;">BOĞA</button>
<button class="burc-btn" data-burc="ikizler" style="top:50%; left:65%;">İKİZLER</button>
<button class="burc-btn" data-burc="yengec" style="top:60%; left:55%;">YENGEÇ</button>
<button class="burc-btn" data-burc="aslan" style="top:40%; left:60%;">ASLAN</button>
<button class="burc-btn" data-burc="basak" style="top:50%; left:70%;">BAŞAK</button>
<button class="burc-btn" data-burc="terazi" style="top:55%; left:45%;">TERAZİ</button>
<button class="burc-btn" data-burc="akrep" style="top:65%; left:50%;">AKREP</button>
<button class="burc-btn" data-burc="yay" style="top:50%; left:40%;">YAY</button>
<button class="burc-btn" data-burc="oglak" style="top:60%; left:35%;">OĞLAK</button>
<button class="burc-btn" data-burc="kova" style="top:45%; left:40%;">KOVA</button>
<button class="burc-btn" data-burc="balik" style="top:35%; left:50%;">BALIK</button>

<video id="v" controls></video>

<script>
// Tüm butonlara tıklama eventi
document.querySelectorAll(".burc-btn").forEach(btn=>{
    btn.onclick = function(){
        const burc = this.dataset.burc;
        const v = document.getElementById("v");
        v.src = burc + "/" + burc + ".mp4";
        v.style.display = "block";
        v.play();
    }
});

// Videoya tıklayınca kapat
document.getElementById("v").onclick = function(){
    this.pause();
    this.style.display = "none";
};
</script>

</body>
</html>
