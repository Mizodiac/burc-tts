<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac</title><style>
body{
margin:0;
background:black;
font-family:sans-serif;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* ANA SAHNE */
.scene{
position:relative;
width:600px;
height:600px;
}

/* ÇARK */
#wheel{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
}

/* BUTON GRID */
.row{
position:absolute;
width:100%;
display:flex;
justify-content:space-between;
}

/* ÜST 1 */
.row.top1{ top:-150px; }

/* ÜST 2 */
.row.top2{ top:-70px; }

/* ALT */
.row.bottom{ bottom:-120px; }

/* SARI BUTON */
.burc{
width:130px;
height:60px;
background:linear-gradient(#ffd400,#f0b800);
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:18px;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,.6);
transition:.25s;
}

.burc:hover{
transform:scale(1.08);
}

/* VIDEO */
#video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:contain;
background:black;
display:none;
z-index:999;
}
</style></head><body><div class="scene"><img src="zodiac-background.jpg" id="wheel"><!-- ÜST SIRA 1 --><div class="row top1">
<div class="burc" data-video="mp4/koc.mp4">Koç</div>
<div class="burc" data-video="mp4/boga.mp4">Boğa</div>
<div class="burc" data-video="mp4/ikizler.mp4">İkizler</div>
<div class="burc" data-video="mp4/yengec.mp4">Yengeç</div>
</div><!-- ÜST SIRA 2 --><div class="row top2">
<div class="burc" data-video="mp4/aslan.mp4">Aslan</div>
<div class="burc" data-video="mp4/basak.mp4">Başak</div>
<div class="burc" data-video="mp4/terazi.mp4">Terazi</div>
<div class="burc" data-video="mp4/akrep.mp4">Akrep</div>
</div><!-- ALT SIRA --><div class="row bottom">
<div class="burc" data-video="mp4/yay.mp4">Yay</div>
<div class="burc" data-video="mp4/oglak.mp4">Oğlak</div>
<div class="burc" data-video="mp4/kova.mp4">Kova</div>
<div class="burc" data-video="mp4/balik.mp4">Balık</div>
</div></div><video id="video" controls playsinline></video>

<script>

const video = document.getElementById("video");

document.querySelectorAll(".burc").forEach(btn=>{
btn.onclick = ()=>{

video.pause();
video.currentTime=0;

video.src = btn.dataset.video;
video.load();

video.style.display="block";
video.play();

};
});

video.onended = ()=>{
video.style.display="none";
};

</script></body>
</html>
