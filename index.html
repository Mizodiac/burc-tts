<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title><style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:sans-serif;
}

#container{
position:relative;
width:100vw;
height:100vh;
}

#bg{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

/* BUTON */
.burc-btn{
position:absolute;
transform:translate(-50%,-50%);
padding:7px 12px;
font-size:14px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.6);
background:rgba(0,0,0,0.35);
color:#fff;
backdrop-filter:blur(4px);
cursor:pointer;
transition:0.25s;
}

.burc-btn:hover{
background:gold;
color:#000;
transform:translate(-50%,-50%) scale(1.15);
}

/* PASİF */
.disabled{
opacity:0.25;
pointer-events:none;
}

/* VIDEO */
#video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
display:none;
z-index:10;
opacity:0;
transition:0.5s;
}
</style></head><body><div id="container"><img src="zodiac-background.jpg" id="bg"><video id="video" controls></video>

<!-- BURÇ BUTONLARI --><button class="burc-btn" style="top:8%; left:50%;" data-video="mp4/koc.mp4">Koç</button>
<button class="burc-btn" style="top:18%; left:72%;" data-video="mp4/boga.mp4">Boğa</button>
<button class="burc-btn" style="top:35%; left:88%;" data-video="mp4/ikizler.mp4">İkizler</button>
<button class="burc-btn" style="top:58%; left:90%;" data-video="mp4/yengec.mp4">Yengeç</button>
<button class="burc-btn" style="top:78%; left:75%;" data-video="mp4/aslan.mp4">Aslan</button>
<button class="burc-btn" style="top:90%; left:50%;" data-video="mp4/basak.mp4">Başak</button>
<button class="burc-btn" style="top:78%; left:25%;" data-video="mp4/terazi.mp4">Terazi</button>
<button class="burc-btn" style="top:58%; left:10%;" data-video="mp4/akrep.mp4">Akrep</button>
<button class="burc-btn" style="top:35%; left:12%;" data-video="mp4/yay.mp4">Yay</button>
<button class="burc-btn" style="top:18%; left:28%;" data-video="mp4/oglak.mp4">Oğlak</button>
<button class="burc-btn" style="top:10%; left:38%;" data-video="mp4/kova.mp4">Kova</button>
<button class="burc-btn" style="top:10%; left:62%;" data-video="mp4/balik.mp4">Balık</button>

</div><script>

const video = document.getElementById("video");

/* BUTONLARI KONTROL */
document.querySelectorAll(".burc-btn").forEach(btn=>{

const file = btn.dataset.video;

/* VIDEO VAR MI */
fetch(file,{method:"HEAD"})
.then(res=>{
if(!res.ok){
btn.classList.add("disabled");
}
})
.catch(()=>{
btn.classList.add("disabled");
});

/* TIKLAMA */
btn.onclick = ()=>{

video.src = file;
video.style.display="block";

setTimeout(()=>{
video.style.opacity="1";
video.play();
},100);

};

});

/* VİDEO BİTİNCE */
video.onended = ()=>{
video.style.opacity="0";

setTimeout(()=>{
video.style.display="none";
},500);
};

</script></body>
</html>
