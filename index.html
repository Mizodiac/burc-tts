<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burç</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* BLUR ARKA PLAN */
.bg-blur{
    position:fixed;
    width:100%;
    height:100%;
    background:url("zodiac-background.jpg") center/cover no-repeat;
    filter:blur(25px);
    z-index:-1;
}

/* ANA GÖRSEL */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:contain;
}

/* ORTA BUTON */
button{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(#FFD700,#D4AF37);
    color:black;
    font-size:28px;
    font-weight:bold;
    padding:12px 35px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    box-shadow:0 0 20px gold;
    transition:0.3s;
}

button:hover{
    transform:translate(-50%,-50%) scale(1.1);
}

/* VIDEO */
video{
    position:fixed;
    width:100%;
    height:100%;
    display:none;
    background:black;
}
</style>
</head>

<body>

<div class="bg-blur"></div>
<img src="zodiac-background.jpg" class="bg">

<button id="btn"></button>
<video id="v" controls></video>

<script>
// Burçlar
const burclar = {
    koc: "KOÇ",
    boga: "BOĞA",
    ikizler: "İKİZLER",
    yengec: "YENGEÇ",
    aslan: "ASLAN",
    basak: "BAŞAK",
    terazi: "TERAZİ",
    akrep: "AKREP",
    yay: "YAY",
    oglak: "OĞLAK",
    kova: "KOVA",
    balik: "BALIK"
};

// URL parametreleri
const urlParams = new URLSearchParams(window.location.search);
const burc = urlParams.get("burc");
const id = urlParams.get("id"); // Müşteri ID

// default: koç
const secilen = burc && burclar[burc] ? burc : "koc";

// buton yazısı
const btn = document.getElementById("btn");
btn.innerText = burclar[secilen];

// butona tıklayınca video aç
btn.onclick = function(){
    const v = document.getElementById("v");
    v.src = secilen + "/" + secilen + ".mp4";
    v.style.display = "block";
    v.play();

    // Müşteri ID loglama
    console.log("Müşteri ID:", id);
};

// videoya tıklayınca kapat
document.getElementById("v").onclick = function(){
    this.pause();
    this.style.display = "none";
};
</script>

</body>
</html>
