<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title>

<style>
body {
  margin:0;
  background:black;
  overflow:hidden;
  font-family:sans-serif;
}

#container {
  position:relative;
  width:100vw;
  height:100vh;
}

#bg {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTON TASARIMI */
.burc-btn {
  position:absolute;
  transform:translate(-50%,-50%);
  padding:6px 10px;
  font-size:13px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.6);
  background:rgba(0,0,0,0.35);
  color:#fff;
  backdrop-filter:blur(4px);
  cursor:pointer;
  transition:0.2s;
}

.burc-btn:hover {
  background:rgba(255,204,0,0.8);
  color:#000;
  transform:translate(-50%,-50%) scale(1.1);
}

/* VIDEO */
#video {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  object-fit:cover;
  z-index:10;
}
</style>
</head>

<body>

<div id="container">

<img src="zodiac-background.jpg" id="bg">

<!-- VIDEO -->
<video id="video" controls></video>

<!-- 🔥 PIXEL PERFECT BUTONLAR -->

<button class="burc-btn" style="top:8%; left:50%;" data-burc="koc">Koç</button>
<button class="burc-btn" style="top:18%; left:72%;" data-burc="boga">Boğa</button>
<button class="burc-btn" style="top:35%; left:88%;" data-burc="ikizler">İkizler</button>
<button class="burc-btn" style="top:58%; left:90%;" data-burc="yengec">Yengeç</button>
<button class="burc-btn" style="top:78%; left:75%;" data-burc="aslan">Aslan</button>
<button class="burc-btn" style="top:90%; left:50%;" data-burc="basak">Başak</button>
<button class="burc-btn" style="top:78%; left:25%;" data-burc="terazi">Terazi</button>
<button class="burc-btn" style="top:58%; left:10%;" data-burc="akrep">Akrep</button>
<button class="burc-btn" style="top:35%; left:12%;" data-burc="yay">Yay</button>
<button class="burc-btn" style="top:18%; left:28%;" data-burc="oglak">Oğlak</button>
<button class="burc-btn" style="top:10%; left:38%;" data-burc="kova">Kova</button>
<button class="burc-btn" style="top:10%; left:62%;" data-burc="balik">Balık</button>

</div>

<script>

/* VIDEO DATA (şimdilik boş, sen mp4 ekleyeceksin) */
const data = {
  koc:"mp4/koc.mp4",
  boga:"mp4/boga.mp4",
  ikizler:"mp4/ikizler.mp4",
  yengec:"mp4/yengec.mp4",
  aslan:"mp4/aslan.mp4",
  basak:"mp4/basak.mp4",
  terazi:"mp4/terazi.mp4",
  akrep:"mp4/akrep.mp4",
  yay:"mp4/yay.mp4",
  oglak:"mp4/oglak.mp4",
  kova:"mp4/kova.mp4",
  balik:"mp4/balik.mp4"
};

const video = document.getElementById("video");

/* BUTON TIKLAMA */
document.querySelectorAll(".burc-btn").forEach(btn=>{
  btn.onclick = () => {
    const burc = btn.dataset.burc;

    video.src = data[burc];
    video.style.display = "block";
    video.muted = false;
    video.play();
  };
});

/* VIDEO BİTİNCE KAPAT */
video.onended = () => {
  video.style.display = "none";
};

</script>

</body>
</html>
