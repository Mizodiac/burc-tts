<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Burç Butonları</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  #zodiac-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: url('zodiac-background.jpg') no-repeat center center;
    background-size: cover;
  }
  .burc-btn {
    position: absolute;
    padding: 8px 12px;
    background-color: #FFD700; /* sarı */
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .burc-btn:hover {
    transform: scale(1.1);
  }
</style>
</head>
<body>
<div id="zodiac-container">
  <!-- Burç Butonları -->
  <button class="burc-btn" style="top:10%; left:50%;" onclick="burcTiklandi('Koç')">Koç</button>
  <button class="burc-btn" style="top:20%; left:75%;" onclick="burcTiklandi('Boğa')">Boğa</button>
  <button class="burc-btn" style="top:40%; left:85%;" onclick="burcTiklandi('İkizler')">İkizler</button>
  <button class="burc-btn" style="top:60%; left:80%;" onclick="burcTiklandi('Yengeç')">Yengeç</button>
  <button class="burc-btn" style="top:75%; left:60%;" onclick="burcTiklandi('Aslan')">Aslan</button>
  <button class="burc-btn" style="top:80%; left:40%;" onclick="burcTiklandi('Başak')">Başak</button>
  <button class="burc-btn" style="top:75%; left:20%;" onclick="burcTiklandi('Terazi')">Terazi</button>
  <button class="burc-btn" style="top:60%; left:10%;" onclick="burcTiklandi('Akrep')">Akrep</button>
  <button class="burc-btn" style="top:40%; left:15%;" onclick="burcTiklandi('Yay')">Yay</button>
  <button class="burc-btn" style="top:20%; left:25%;" onclick="burcTiklandi('Oğlak')">Oğlak</button>
  <button class="burc-btn" style="top:10%; left:40%;" onclick="burcTiklandi('Kova')">Kova</button>
  <button class="burc-btn" style="top:15%; left:55%;" onclick="burcTiklandi('Balık')">Balık</button>
</div>

<script>
  function burcTiklandi(burc) {
    alert(burc + " butonuna tıkladınız!");
    // Buraya sunum geçişi veya başka işlem ekleyebilirsin
  }
</script>
</body>
</html>
