<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title>
<style>
/* 🌍 GENEL */
body, html { margin:0; padding:0; width:100%; height:100%; font-family:sans-serif; overflow:hidden; background:#000; }
#zodiac-container { position:relative; width:100%; height:100%; }
#zodiac-bg { width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:0; }

/* 🧿 BURÇ PNG */
#burc-simge { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); width:150px; z-index:3; transition: transform 0.8s ease; }

/* 🪐 GEZEGEN VIDEO */
#gezegen-video { position:absolute; top:20%; right:10%; width:220px; z-index:2; display:none; }

/* 🌿 ELEMENT */
#element-icon { position:absolute; top:20%; right:10%; width:150px; z-index:2; display:none; }

/* 📝 ÖZELLİKLER */
#ozellikler-display { position:absolute; top:20%; left:10%; color:white; font-size:18px; z-index:3; }
.feature-item { opacity:0; transform:translateY(-20px); transition:opacity 0.5s ease, transform 0.5s ease; margin-bottom:10px; }
.feature-item.show { opacity:1; transform:translateY(0); }

/* 🔢 SAYILAR */
#sayi-display { position:absolute; bottom:15%; left:50%; transform:translateX(-50%); color:#ffcc00; font-size:24px; font-weight:bold; z-index:3; }

/* 🔘 BURÇ BUTONLARI */
#burc-buttons { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:5px; z-index:4; }
#burc-buttons button { padding:10px 12px; font-size:16px; border-radius:6px; background:#ffcc00; border:none; cursor:pointer; }
</style>
</head>
<body>
<div id="zodiac-container">
  <img src="zodiac-background.jpg" id="zodiac-bg">
  <img id="burc-simge" class="hidden">
  <video id="gezegen-video" class="hidden" muted></video>
  <img id="element-icon" class="hidden">
  <div id="ozellikler-display" class="hidden"></div>
  <div id="sayi-display" class="hidden"></div>

  <div id="burc-buttons">
    <button onclick='runShow("koc")'>Koç</button>
    <button onclick='runShow("boga")'>Boğa</button>
    <button onclick='runShow("ikizler")'>İkizler</button>
    <button onclick='runShow("yengec")'>Yengeç</button>
    <button onclick='runShow("aslan")'>Aslan</button>
    <button onclick='runShow("basak")'>Başak</button>
    <button onclick='runShow("terazi")'>Terazi</button>
    <button onclick='runShow("akrep")'>Akrep</button>
    <button onclick='runShow("yay")'>Yay</button>
    <button onclick='runShow("oglak")'>Oğlak</button>
    <button onclick='runShow("kova")'>Kova</button>
    <button onclick='runShow("balik")'>Balık</button>
  </div>
</div>

<script>
const burcSimge=document.getElementById("burc-simge");
const elementIcon=document.getElementById("element-icon");
const ozelliklerDisplay=document.getElementById("ozellikler-display");
const sayiDisplay=document.getElementById("sayi-display");
const gezegenVideoEl=document.getElementById("gezegen-video");

const data = {
  koc:{tanitim:"mp3/koc_tanitim.mp3",ozellikler:"mp3/koc_ozellikler.mp3",gezegenVideo:"icons/mars.mp4",element:"mp3/koc_element.mp3",elementIcon:"icons/ates.png",sayilar:"1, 8, 17",features:["Cesur","Enerjik","Lider"]},
  boga:{tanitim:"mp3/boga_tanitim.mp3",ozellikler:"mp3/boga_ozellikler.mp3",gezegenVideo:"icons/venus.mp4",element:"mp3/boga_element.mp3",elementIcon:"icons/toprak.png",sayilar:"2, 6, 9",features:["Sabırlı","Kararlı","Sadık"]},
  ikizler:{tanitim:"mp3/ikizler_tanitim.mp3",ozellikler:"mp3/ikizler_ozellikler.mp3",gezegenVideo:"icons/merkur.mp4",element:"mp3/ikizler_element.mp3",elementIcon:"icons/hava.png",sayilar:"3, 7, 12",features:["Zeki","Hızlı","Meraklı"]},
  yengec:{tanitim:"mp3/yengec_tanitim.mp3",ozellikler:"mp3/yengec_ozellikler.mp3",gezegenVideo:"icons/moon.mp4",element:"mp3/yengec_element.mp3",elementIcon:"icons/su.png",sayilar:"2, 7, 11",features:["Duygusal","Sevgi dolu","Koruyucu"]},
  aslan:{tanitim:"mp3/aslan_tanitim.mp3",ozellikler:"mp3/aslan_ozellikler.mp3",gezegenVideo:"icons/sun.mp4",element:"mp3/aslan_element.mp3",elementIcon:"icons/ates.png",sayilar:"1, 5, 9",features:["Cesur","Gururlu","Yaratıcı"]},
  basak:{tanitim:"mp3/basak_tanitim.mp3",ozellikler:"mp3/basak_ozellikler.mp3",gezegenVideo:"icons/merkur(1).mp4",element:"mp3/basak_element.mp3",elementIcon:"icons/toprak.png",sayilar:"5, 14, 23",features:["Titiz","Analitik","Dikkatli"]},
  terazi:{tanitim:"mp3/terazi_tanitim.mp3",ozellikler:"mp3/terazi_ozellikler.mp3",gezegenVideo:"icons/venus(1).mp4",element:"mp3/terazi_element.mp3",elementIcon:"icons/hava.png",sayilar:"6, 15, 24",features:["Adil","Sosyal","Estetik"]},
  akrep:{tanitim:"mp3/akrep_tanitim.mp3",ozellikler:"mp3/akrep_ozellikler.mp3",gezegenVideo:"icons/pluton.mp4",element:"mp3/akrep_element.mp3",elementIcon:"icons/su.png",sayilar:"8, 11, 18",features:["Tutkulu","Kararlı","Gizemli"]},
  yay:{tanitim:"mp3/yay_tanitim.mp3",ozellikler:"mp3/yay_ozellikler.mp3",gezegenVideo:"icons/jupiter.mp4",element:"mp3/yay_element.mp3",elementIcon:"icons/ates.png",sayilar:"3, 7, 9",features:["Özgür","Neşeli","Maceracı"]},
  oglak:{tanitim:"mp3/oglak_tanitim.mp3",ozellikler:"mp3/oglak_ozellikler.mp3",gezegenVideo:"icons/saturn.mp4",element:"mp3/oglak_element.mp3",elementIcon:"icons/toprak.png",sayilar:"4, 8, 13",features:["Disiplinli","Sabırlı","Sorumlu"]},
  kova:{tanitim:"mp3/kova_tanitim.mp3",ozellikler:"mp3/kova_ozellikler.mp3",gezegenVideo:"icons/uranus.mp4",element:"mp3/kova_element.mp3",elementIcon:"icons/hava.png",sayilar:"4, 7, 11",features:["Özgün","Zeki","İnsansever"]},
  balik:{tanitim:"mp3/balik_tanitim.mp3",ozellikler:"mp3/balik_ozellikler.mp3",gezegenVideo:"icons/neptun.mp4",element:"mp3/balik_element.mp3",elementIcon:"icons/su.png",sayilar:"3, 7, 12",features:["Sevgi dolu","Duygusal","Hayalperest"]}
};

function hideAll(){ [burcSimge, elementIcon, gezegenVideoEl, ozelliklerDisplay, sayiDisplay].forEach(el=>el.style.display="none"); }
function show(el, src=null){ if(src){ if(el.tagName==="VIDEO"){ el.src=src; el.currentTime=0; el.play(); } else el.src=src; } el.style.display="block"; }
function playAudio(src){ return new Promise(resolve=>{ const audio=new Audio(src); audio.play(); audio.onended=resolve; }); }
async function showFeatures(features,audioSrc){ ozelliklerDisplay.innerHTML=""; show(ozelliklerDisplay); const audio=new Audio(audioSrc); audio.play(); for(let i=0;i<features.length;i++){ const div=document.createElement("div"); div.className="feature-item"; div.innerText=features[i]; ozelliklerDisplay.appendChild(div); await new Promise(r=>setTimeout(r,500)); div.classList.add("show"); } return new Promise(resolve=>{ audio.onended=resolve; }); }

async function runShow(burc){
  const b=data[burc]; if(!b){ alert("Burç bulunamadı"); return; }
  hideAll();
  document.body.style.background="#000";

  // Tanıtım
  await playAudio(b.tanitim);
  burcSimge.src=b.simge; burcSimge.style.transform="translate(-50%,-50%) scale(1.5)"; show(burcSimge);
  await new Promise(r=>setTimeout(r,800));

  // Özellikler + Gezegen
  show(gezegenVideoEl,b.gezegenVideo); gezegenVideoEl.play();
  await showFeatures(b.features,b.ozellikler);
  gezegenVideoEl.pause(); hideAll();

  // Element
  elementIcon.src=b.elementIcon; show(elementIcon);
  await playAudio(b.element);
  hideAll();

  // Sayılar
  sayiDisplay.innerText=b.sayilar; show(sayiDisplay);
  await playAudio(b.sayi);
  hideAll();
}
</script>
</body>
</html>
