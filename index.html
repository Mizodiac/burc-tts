<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title><style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:sans-serif;
}

#container{
position:relative;
width:100vw;
height:100vh;
}

#bg{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}

.burc-btn{
position:absolute;
transform:translate(-50%,-50%);
padding:8px 14px;
font-size:15px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.6);
background:rgba(0,0,0,0.35);
color:#fff;
cursor:pointer;
transition:.25s;
z-index:2;
}

.burc-btn:hover{
background:gold;
color:#000;
transform:translate(-50%,-50%) scale(1.2);
}

/* ⭐ VIDEO TAMAMI GÖRÜNSÜN */
#video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:contain;   /* 🔥 EN KRİTİK SATIR */
background:black;
display:none;
z-index:999;
}
</style></head><body><div id="container"><img src="zodiac-background.jpg" id="bg"><video id="video" controls playsinline></video>

<button class="burc-btn" style="top:8%; left:50%;" data-video="mp4/koc.mp4">Koç</button>
<button class="burc-btn" style="top:18%; left:72%;" data-video="mp4/boga.mp4">Boğa</button>
<button class="burc-btn" style="top:35%; left:88%;" data-video="mp4/ikizler.mp4">İkizler</button>
<button class="burc-btn" style="top:58%; left:90%;" data-video="mp4/yengec.mp4">Yengeç</button>
<button class="burc-btn" style="top:78%; left:75%;" data-video="mp4/aslan.mp4">Aslan</button>
<button class="burc-btn" style="top:90%; left:50%;" data-video="mp4/basak.mp4">Başak</button>
<button class="burc-btn" style="top:78%; left:25%;" data-video="mp4/terazi.mp4">Terazi</button>
<button class="burc-btn" style="top:58%; left:10%;" data-video="mp4/akrep.mp4">Akrep</button>
<button class="burc-btn" style="top:35%; left:12%;" data-video="mp4/yay.mp4">Yay</button>
<button class="burc-btn" style="top:18%; left:28%;" data-video="mp4/oglak.mp4">Oğlak</button>
<button class="burc-btn" style="top:10%; left:38%;" data-video="mp4/kova.mp4">Kova</button>
<button class="burc-btn" style="top:10%; left:62%;" data-video="mp4/balik.mp4">Balık</button>

</div><script>

const video = document.getElementById("video");
const buttons = document.querySelectorAll(".burc-btn");
const bg = document.getElementById("bg");

buttons.forEach(btn=>{
btn.onclick = ()=>{

buttons.forEach(b=>b.style.display="none");
bg.style.display="none";

video.src = btn.dataset.video;
video.load();

video.style.display="block";
video.play();

};
});

video.onended = ()=>{
video.style.display="none";
buttons.forEach(b=>b.style.display="block");
bg.style.display="block";
};

</script></body>
</html>
