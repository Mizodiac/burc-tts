<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac</title><style>

body{
margin:0;
background:black;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* SAHNE */
.scene{
position:relative;
width:90vw;
max-width:620px;
aspect-ratio:1/1;
}

/* ÇARK */
#wheel{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
}

/* ÜST BLOK */
.topBlock{
position:absolute;
bottom:100%;
width:100%;
display:flex;
flex-direction:column;
gap:2vw;
margin-bottom:2vw;
}

/* ALT BLOK */
.bottomBlock{
position:absolute;
top:100%;
width:100%;
display:flex;
justify-content:space-between;
gap:2vw;
margin-top:2vw;
}

/* GRID */
.row{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:2vw;
}

/* BUTON */
.burc{
height:12vw;
max-height:60px;
background:linear-gradient(#ffd400,#f0b800);
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:3.8vw;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,.6);
transition:.25s;
}

.burc:hover{
transform:scale(1.05);
}

/* VIDEO */
#video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:contain;
background:black;
display:none;
z-index:999;
}

</style></head><body><div class="scene"><img src="zodiac-background.jpg" id="wheel"><!-- ÜST 8 BUTON --><div class="topBlock"><div class="row">
<div class="burc" data-video="mp4/koc.mp4">Koç</div>
<div class="burc" data-video="mp4/boga.mp4">Boğa</div>
<div class="burc" data-video="mp4/ikizler.mp4">İkizler</div>
<div class="burc" data-video="mp4/yengec.mp4">Yengeç</div>
</div><div class="row">
<div class="burc" data-video="mp4/aslan.mp4">Aslan</div>
<div class="burc" data-video="mp4/basak.mp4">Başak</div>
<div class="burc" data-video="mp4/terazi.mp4">Terazi</div>
<div class="burc" data-video="mp4/akrep.mp4">Akrep</div>
</div></div><!-- ALT 4 BUTON --><div class="bottomBlock">
<div class="burc" data-video="mp4/yay.mp4">Yay</div>
<div class="burc" data-video="mp4/oglak.mp4">Oğlak</div>
<div class="burc" data-video="mp4/kova.mp4">Kova</div>
<div class="burc" data-video="mp4/balik.mp4">Balık</div>
</div></div><video id="video" controls playsinline></video>

<script>

const video = document.getElementById("video");

document.querySelectorAll(".burc").forEach(btn=>{
btn.onclick = ()=>{

video.pause();
video.currentTime=0;

video.src = btn.dataset.video;
video.load();

video.style.display="block";
video.play();

};
});

video.onended = ()=>{
video.style.display="none";
};

</script></body>
</html>
