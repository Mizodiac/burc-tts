<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizodiac Show</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="zodiac-container">

  <!-- 🖼️ ARKA PLAN -->
  <img src="zodiac-background.jpg" id="zodiac-bg">

  <!-- 🧿 BURÇ -->
  <img id="burc-simge" class="hidden">

  <!-- 🌿 ELEMENT -->
  <img id="element-icon" class="hidden">

  <!-- 📝 ÖZELLİK -->
  <div id="ozellikler-display" class="hidden"></div>

  <!-- 🔢 SAYI -->
  <div id="sayi-display" class="hidden"></div>

  <!-- 🎥 VIDEO -->
  <video id="gezegen-video" class="hidden" muted></video>

  <!-- 🔘 BURÇ BUTONLARI -->
  <div id="test-buttons" style="
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:5;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    max-height:40%;
    overflow-y:auto;
  ">
    <button data-burc="koc">Koç</button>
    <button data-burc="boga">Boğa</button>
    <button data-burc="ikizler">İkizler</button>
    <button data-burc="yengec">Yengeç</button>
    <button data-burc="aslan">Aslan</button>
    <button data-burc="basak">Başak</button>
    <button data-burc="terazi">Terazi</button>
    <button data-burc="akrep">Akrep</button>
    <button data-burc="yay">Yay</button>
    <button data-burc="oglak">Oğlak</button>
    <button data-burc="kova">Kova</button>
    <button data-burc="balik">Balık</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
